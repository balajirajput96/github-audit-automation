name: Hourly GitHub audit continuation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: hourly-github-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The repository-scoped GitHub Actions token is retained only so this
          # workflow can append secret-free audit state to automation-state.
          persist-credentials: true

      - name: Load prior automation state
        id: prior-state
        env:
          GH_TOKEN: ${{ secrets.AUDIT_GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code origin refs/heads/automation-state >/dev/null 2>&1; then
            git fetch --no-tags origin automation-state:refs/remotes/origin/automation-state
            git show refs/remotes/origin/automation-state:state/execution-state.json > "$RUNNER_TEMP/previous-state.json"
          else
            printf '{"execution_number":0}\n' > "$RUNNER_TEMP/previous-state.json"
          fi

      - name: Run secret-safe repository inventory
        env:
          GH_TOKEN: ${{ secrets.AUDIT_GH_TOKEN || github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/run_audit.sh
          mkdir -p "$RUNNER_TEMP/audit"
          scripts/run_audit.sh "$RUNNER_TEMP/audit" "$RUNNER_TEMP/previous-state.json"

      - name: Publish audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hourly-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 30

      - name: Persist execution state on dedicated branch
        env:
          GH_TOKEN: ${{ secrets.AUDIT_GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code origin refs/heads/automation-state >/dev/null 2>&1; then
            git fetch --no-tags origin automation-state:refs/remotes/origin/automation-state
            git switch --create automation-state --track origin/automation-state
          else
            git switch --orphan automation-state
            git rm -rf . 2>/dev/null || true
          fi
          rm -rf artifacts
          mkdir -p state artifacts
          cp "$RUNNER_TEMP/audit/execution-state.json" state/execution-state.json
          execution_number="$(jq -r '.execution_number' "$RUNNER_TEMP/audit/execution-state.json")"
          case "$execution_number" in
            ''|*[!0-9]*) echo 'Invalid execution number in audit state.' >&2; exit 1 ;;
          esac
          cp "$RUNNER_TEMP/audit/execution-state.json" "state/execution-${execution_number}.json"
          index_file="state/execution-index.ndjson"
          temporary_index="$(mktemp)"
          if [ -f "$index_file" ]; then
            jq -c --argjson execution_number "$execution_number" 'select(.execution_number != $execution_number)' "$index_file" > "$temporary_index"
          fi
          jq -c '{execution_number,timestamp,repository,workflow,source_commit,toolchain,action,result,failure_category,recovery_attempt,validation_status,remaining_blocker,next_action}' "$RUNNER_TEMP/audit/execution-state.json" >> "$temporary_index"
          mv "$temporary_index" "$index_file"
          mapfile -t detailed_states < <(find state -maxdepth 1 -type f -name 'execution-[0-9]*.json' -printf '%f\n' | sort -t- -k2,2n)
          if [ "${#detailed_states[@]}" -gt 24 ]; then
            for ((index=0; index < ${#detailed_states[@]} - 24; index++)); do
              rm -f "state/${detailed_states[$index]}"
            done
          fi
          cp "$RUNNER_TEMP/audit/repos.tsv" artifacts/repos.tsv
          cp "$RUNNER_TEMP/audit/open-prs.tsv" artifacts/open-prs.tsv
          cp "$RUNNER_TEMP/audit/recent-runs.tsv" artifacts/recent-runs.tsv
          cp "$RUNNER_TEMP/audit/recent-failures.tsv" artifacts/recent-failures.tsv
          cp "$RUNNER_TEMP/audit/gemini-analysis.txt" artifacts/gemini-analysis.txt
          if [ -f "$RUNNER_TEMP/audit/blocker.txt" ]; then cp "$RUNNER_TEMP/audit/blocker.txt" artifacts/blocker.txt; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state artifacts
          if git diff --cached --quiet; then
            echo 'No state change to commit.'
          else
            git commit -m "chore: persist hourly audit execution $GITHUB_RUN_NUMBER"
            git push origin HEAD:automation-state
          fi
